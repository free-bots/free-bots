# Visit https://github.com/lowlighter/metrics#-documentation for full reference
#
# Renders the gh-metrics SVGs, builds readme.webp from them and commits everything in
# ONE commit, but only if the build succeeded and the render passed validation
# (see readme-builder/index.js). On any failure nothing is committed and the README
# keeps showing the last good image.
name: Metrics
on:
  # Daily at 00:00 UTC
  schedule: [{cron: "0 0 * * *"}]
  # Manual runs and every push to the default branch
  workflow_dispatch:
  push: {branches: ["master", "main"]}

# A scheduled run and a push must not race each other on the commit
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # output_action: none -> no commit, the file is written to /metrics_renders/<filename>
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: free-bots
          template: classic
          base: activity
          config_timezone: Europe/Berlin
          filename: metrics.activity.svg
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: free-bots
          template: classic
          base: community
          config_timezone: Europe/Berlin
          filename: metrics.community.svg
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: free-bots
          template: classic
          base: ""
          config_timezone: Europe/Berlin
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          filename: metrics.achievements.svg
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: free-bots
          template: classic
          base: ""
          config_timezone: Europe/Berlin
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, lines
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          filename: metrics.languages.svg
          output_action: none
          plugins_errors_fatal: yes

      - name: Collect metrics renders
        run: |
          for f in activity community achievements languages; do
            src="/metrics_renders/metrics.$f.svg"
            if [ ! -s "$src" ]; then
              echo "::error::gh-metrics render $src is missing or empty"
              ls -la /metrics_renders || true
              exit 1
            fi
            cp "$src" .
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: readme-builder/package-lock.json

      # npm ci downloads Puppeteer's own Chrome; index.js exits non-zero (and leaves
      # readme.webp untouched) if any image, font, icon or metrics section is broken.
      - name: Build and validate readme image
        working-directory: readme-builder
        run: |
          npm ci
          npm run start

      - uses: EndBug/add-and-commit@v11
        name: Commit metrics and readme image
        with:
          add: "metrics.*.svg readme.webp"
          message: "Update metrics and readme.webp"
          default_author: github_actions
